version: "3.7"

# The node runs on the host network: it finds speakers on the LAN (SSDP, mDNS) and serves its
# web UI and API itself on 7788, the manifest port (no app_proxy; umbrelOS adds HTTPS in front).
# Native apps and OpenSubsonic clients on other machines use 7788 with the bearer token, the
# password umbrelOS shows for this app (APP_PASSWORD). The homeserver's admin and database password
# is APP_SEED, which umbrelOS never shows. Keep both secret.
services:
  # The bundled Pubky homeserver (STEWARD-BUNDLED-HOMESERVER.md), as in Pubky's own Umbrel app
  # (github.com/pubky/umbrel-app-store, pubky-homeserver, MIT). Its admin API is reached by the
  # node on this app's network only and is not published. Install this app or Pubky's
  # "Pubky Homeserver" app, not both: both publish the homeserver's Pubky TLS port 6287.
  postgres:
    image: postgres:17-alpine@sha256:ff4ccc02b97e0ebb6b328ef9ff92522f95586f83be6801896b615088defc8ad2
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: pubky
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: pubky_homeserver
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pubky -d pubky_homeserver"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: lets the node (uid 1000) write the tunnel folder it shares with cloudflared and the
  # config wrapper (Settings › Remote access saves the tunnel token and the homeserver's hostname).
  tunnel-folder:
    image: alpine:3.22@sha256:d406446bc05b82480756ce8f1287964d28768c23955fa9480d2a74a2eae7a654
    restart: on-failure
    command: ["sh", "-c", "chown 1000 /tunnel && chmod 755 /tunnel"]
    volumes:
      - ${APP_DATA_DIR}/data/cloudflare:/tunnel

  homeserver-config:
    image: synonymsoft/homeserver-umbrel-config-wrapper:v0.0.8@sha256:23d2ba85fa07e61a9d87550179910d85a03cd49b6532b62c584d9b4e8ba2eb14
    restart: on-failure
    environment:
      POSTGRES_USER: pubky
      POSTGRES_PASSWORD: ${APP_SEED}
      ADMIN_PASSWORD: ${APP_SEED}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
    volumes:
      - ${APP_DATA_DIR}/data/homeserver:/data
      - ${APP_DATA_DIR}/data/cloudflare:/etc/pubky-cloudflare

  homeserver:
    image: synonymsoft/homeserver:v0.16.2@sha256:b357fecec481a37c8af40a7ed70562871a587ecb5bfd251a6e95330f1e61c7df
    restart: on-failure
    stop_signal: SIGINT
    stop_grace_period: 1m
    command: ["homeserver", "--data-dir", "/data"]
    volumes:
      - ${APP_DATA_DIR}/data/homeserver:/data
    ports:
      # Pubky TLS for Pubky apps and Ring on the network
      - "6287:6287"
      # Plain HTTP and the admin API, for the node and cloudflared on this machine only
      - "127.0.0.1:6286:6286"
      - "127.0.0.1:6288:6288"
    depends_on:
      postgres:
        condition: service_healthy
      homeserver-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6288 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  node:
    # The v0.2.0 release image (multi-arch), pinned by digest.
    image: ghcr.io/gillohner/pubky-music-node:0.2.0@sha256:324d0b0e27761bcecf6526f5de80a289160ac921c29bb73c91baea15dd80767a
    restart: on-failure
    stop_grace_period: 10s
    network_mode: host
    environment:
      PM_LISTEN: "0.0.0.0:7788"
      PM_TOKEN: "${APP_PASSWORD}"
      PM_CONTACT: "${APP_PUBKY_MUSIC_CONTACT:-}"
      PM_FOLDERS: "/music"
      PM_NAME: "Umbrel"
      PM_HOMESERVER_ADMIN_URL: "http://127.0.0.1:6288"
      PM_HOMESERVER_ADMIN_PASSWORD: "${APP_SEED}"
      # Settings › Remote access writes the Cloudflare tunnel here (shared with cloudflared)
      PM_TUNNEL_DIR: "/tunnel"
      PM_TUNNEL_RESTART_HINT: "Restart the Pubky Music Node app in Umbrel once (right-click its icon, then Restart)."
      # The homeserver's own files, read-only: the owner's music there is a library folder
      PM_HOMESERVER_FILES_DIR: "/homeserver/data/files"
      RUST_LOG: "info"
    volumes:
      - ${APP_DATA_DIR}/data/node:/data
      - ${APP_DATA_DIR}/data/cloudflare:/tunnel
      - ${APP_DATA_DIR}/data/homeserver:/homeserver:ro
      # Umbrel's shared storage: anything a download app drops here is a scan source.
      - ${UMBREL_ROOT}/data/storage:/music:ro
    devices:
      # A USB DAC plugged into the Umbrel box; remove if no local DAC is used.
      - /dev/snd:/dev/snd
    group_add:
      - audio
    depends_on:
      homeserver:
        condition: service_healthy
      tunnel-folder:
        condition: service_completed_successfully

  # Cloudflare Tunnel (Settings › Remote access saves the token). In the tunnel's public
  # hostnames, send the homeserver's to http://localhost:6286 and the music one to
  # http://localhost:7788. Until a token exists this container exits and retries, as in Pubky's
  # own Umbrel app.
  cloudflared:
    image: cloudflare/cloudflared:2026.5.2@sha256:12ff5c6992a9863db4da270746af7c244bcaee49353039af8104268a18d6c4f0
    restart: on-failure
    stop_grace_period: 1m
    network_mode: host
    # The node's uid: the token it saves is readable by that user only
    user: "1000:1000"
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /etc/pubky-cloudflare/token
    volumes:
      - ${APP_DATA_DIR}/data/cloudflare:/etc/pubky-cloudflare:ro
    depends_on:
      homeserver:
        condition: service_started
