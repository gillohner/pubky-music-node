manifestVersion: 1
id: pubky-music-node
category: media
name: Pubky Music Node
version: "0.1.0"
tagline: Bit-perfect music server and zones, built on Pubky
icon: https://raw.githubusercontent.com/gillohner/pubky-music-node/main/deploy/umbrel/pubky-music-node/icon.svg
description: >-
  A self-hosted music core in the spirit of Roon: scans your music folders
  (local, mounted shares, or anything another app downloads into them), keeps
  a library with MusicBrainz identities, and plays bit-perfect to a USB DAC on
  the Umbrel box or to network zones. Playlists and social features live on
  your Pubky homeserver; discovery comes from Pinakes. Control it with the
  Pubky Music app on your laptop or phone, which can also play your library
  locally through its own DAC.

  Set the API token in the app settings on first start and point the Pubky
  Music controller at this node's address with that token. Plug a USB DAC into
  the Umbrel box to play directly from it.
developer: Pubky Music
website: https://github.com/gillohner/pubky-music-node
