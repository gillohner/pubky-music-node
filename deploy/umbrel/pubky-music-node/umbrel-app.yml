manifestVersion: 1
id: pubky-music-node
category: media
name: Pubky Music Node
version: "0.2.0"
tagline: Bit-perfect music server and zones, built on Pubky
icon: https://raw.githubusercontent.com/gillohner/pubky-music-node/main/deploy/umbrel/pubky-music-node/icon.svg
description: >-
  A self-hosted music server in the spirit of Roon, built on Pubky. It scans
  your music folders (local, mounted shares, or anything another app downloads
  into them), keeps a library with MusicBrainz identities, cover art, artist
  biographies and genres, and plays bit-perfect to a USB DAC on the Umbrel box,
  to network endpoints, UPnP/OpenHome renderers, Squeezebox players and
  Chromecast, with a signal path that shows every conversion. Zones can be
  grouped and get their own DSP (EQ, convolution, crossfeed, ReplayGain).
  Internet radio with live titles. Playlists, favourites, reviews and tags live
  on your Pubky homeserver as v1 objects; discovery comes from Pinakes.

  Open the app for the built-in web controller (enter the app password Umbrel
  shows once; your Umbrel storage is already a library folder; set the upstream
  contact in Settings), or point the
  native Pubky Music app or any OpenSubsonic client (Symfonium, Feishin,
  Amperfy) at this node's address with that token.
developer: Pubky Music
website: https://github.com/gillohner/pubky-music-node
dependencies: []
repo: https://github.com/gillohner/pubky-music-node
support: https://github.com/gillohner/pubky-music-node/issues
port: 7788
gallery: []
path: /
defaultUsername: ""
defaultPassword: ""
# APP_PASSWORD (shown by umbrelOS): the token for the web UI, the apps and Subsonic clients.
deterministicPassword: true
releaseNotes: >-
  v0.2.0. Your Umbrel storage is read at start and listed in Settings › Library folders, with
  no folder to add. Sonos and UPnP/Cast speakers get the box's network address without any
  setting. Settings now has four groups (You, This device, This node, This homeserver), matching
  the guides. Group Sonos, HEOS and BluOS speakers from Settings. Get started shows only what is
  left and can be hidden. Security fixes from the October review; offline downloads in the
  phone and desktop app; the player shows what it is streaming.
submitter: Pubky Music
submission: https://github.com/gillohner/pubky-music-node
