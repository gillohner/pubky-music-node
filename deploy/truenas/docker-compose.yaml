# Pubky Music Node on TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML.
# Edit the two paths before installing. Without PM_TOKEN the node makes a token on first start
# and keeps it in the data dataset (api-token, readable only by the container's user): sign in
# with that. PM_TOKEN added after the first start also needs PM_REWRITE_CONFIG: "1" once. The image runs as uid 1000,
# so the data dataset must be writable by that user (chown -R 1000:1000 or set
# `user:` below to the dataset's owner). The music dataset is mounted read-only.
services:
  node:
    image: ghcr.io/gillohner/pubky-music-node:edge
    container_name: pubky-music
    restart: unless-stopped
    # Host networking: UPnP/OpenHome renderers (Linn, Naim, …), Chromecast and endpoints are found
    # by multicast and fetch audio from the node, neither of which crosses Docker's bridge.
    network_mode: host
    environment:
      PM_LISTEN: "0.0.0.0:7788"
      # The address devices fetch audio from; by default the NAS's own address on the network.
      # Set it only when that is not the one they reach (several networks, a name):
      # PM_PUBLIC_URL: "http://192.168.1.10:7788"
      # Your own token instead (a long random string): PM_TOKEN: "…"
      PM_CONTACT: "you@example.org"
      PM_NAME: "TrueNAS"
      PM_FOLDERS: "/music"
      # TIDAL developer app (optional); register http://<nas>:7788/tidal/callback on it.
      PM_TIDAL_CLIENT_ID: ""
      PM_TIDAL_CLIENT_SECRET: ""
      RUST_LOG: "info"
    volumes:
      - /mnt/tank/music:/music:ro
      - /mnt/tank/apps/pubky-music:/data
    # A USB DAC on the NAS itself: uncomment and keep the audio group.
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - audio
