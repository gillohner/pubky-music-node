[package]
name = "pm-library"
description = "Library scanning, tag reading, MBID/ISRC matching and the SQLite catalogue for the Pubky Music Node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["musicbrainz"]
musicbrainz = ["dep:reqwest", "dep:tokio", "dep:serde_json", "dep:url"]

[dependencies]
pm-model = { workspace = true }
blake3 = { workspace = true }
id3 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
symphonia = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
calamine = { version = "0.37", default-features = false }

[dev-dependencies]
hound = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
zip = { version = "2", default-features = false }
