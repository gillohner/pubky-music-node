[package]
name = "pm-desktop"
description = "Pubky Music desktop: the web UI in a native window, signed in with Pubky Ring"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/gillohner/pubky-music-node"

# Kept out of the workspace members: wry needs WebKitGTK on Linux, which the
# node's build machines do not have. CI and the release build it on their own.

[dependencies]
pm-pubky = { path = "../pm-pubky" }
pm-client = { path = "../pm-client" }
pm-stream = { path = "../pm-stream" }
tao = "0.30"
wry = "0.47"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# The built-in player: bit-perfect ALSA `hw:` devices on Linux, the system
# output elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
pm-endpoint = { path = "../pm-endpoint", features = ["alsa", "cpal"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
pm-endpoint = { path = "../pm-endpoint", features = ["cpal"] }
