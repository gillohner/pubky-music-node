[package]
name = "pm-pubky"
description = "Pubky integration for the music node: social schemas, homeserver read/write, Pinakes and Nexus clients, discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true


[dependencies]
pm-model = { workspace = true }
base32 = "0.5"
blake3 = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
pubky = { workspace = true }
pubky-app-specs = { workspace = true }
pubky-music-specs = { workspace = true, features = ["vault"] }
pubky-social-specs = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tracing = { workspace = true }
url = { workspace = true }
zeroize = "1"

[dev-dependencies]
# The vault client key must be the Noise static key pubky-noise derives from the same secret
pubky-noise = "=0.1.0"
tempfile = "3"
tokio = { workspace = true }
