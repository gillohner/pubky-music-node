[package]
name = "pm-out-cast"
description = "Chromecast / Google Cast receivers as outputs of the Pubky Music Node (pull streams)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pm-model = { workspace = true }
pm-zones = { workspace = true }
async-trait = { workspace = true }
mdns-sd = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = { workspace = true }
