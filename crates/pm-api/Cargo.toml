[package]
name = "pm-api"
description = "Native HTTP + WebSocket API (/v1) of the Pubky Music Node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
qrcode = { version = "0.14", default-features = false }
pm-model = { workspace = true }
pm-zones = { workspace = true }
pm-discovery = { workspace = true }
pm-remote = { workspace = true }
uuid = { workspace = true }
pm-audio = { workspace = true }
pm-library = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "query", "stream"] }
symphonia = { workspace = true }
pm-pubky = { workspace = true }
pm-out-upnp = { workspace = true }
pm-out-slimproto = { workspace = true }
pm-out-cast = { workspace = true }
pm-out-snapcast = { workspace = true }
pm-out-airplay = { workspace = true }
pm-out-net = { workspace = true }
pubky = { workspace = true }
pubky-app-specs = { workspace = true }
pubky-music-specs = { workspace = true }
pubky-social-specs = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
md-5 = "0.10"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
# Backups: the file is a zip; the secrets in it are encrypted with a passphrase
zip = { version = "2", default-features = false, features = ["deflate"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
time = { workspace = true }
url = { workspace = true }
notify = "8"
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
bytes = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
pm-endpoint = { workspace = true }
id3 = { workspace = true }
hound = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
