<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { color-scheme: dark; --bg: #0f1014; --surface: #16171d; --surface-2: #1d1f27; --line: rgba(255,255,255,.08); --fg: #ecedf2; --muted: #8d91a0; --accent: #8b7cf6; --on-accent: #0e0b1f; --warn: #e8b24a; --bad: #ef6b6b; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f6f6f9; --surface: #fff; --surface-2: #eeeef4; --line: rgba(0,0,0,.09); --fg: #17181d; --muted: #5d6170; --accent: #6b5ae6; --on-accent: #fff; --warn: #8a5a00; --bad: #b42323; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 4px 0 2px; }
  h2 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .cover { width: 48px; height: 48px; border-radius: 6px; background: var(--surface-2); flex: 0 0 48px; object-fit: cover; }
  .grow { flex: 1; min-width: 0; }
  .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  input { width: 100%; font: inherit; color: inherit; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; min-height: 44px; }
  button.ghost { background: var(--surface-2); color: var(--fg); }
  button:disabled { opacity: .5; cursor: default; }
  form { display: flex; gap: 8px; }
  .you { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-left: 6px; }
  #msg { margin: 12px 0 0; min-height: 1.2em; }
  #msg.bad { color: var(--bad); }
  .hidden { display: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <section id="join" class="hidden">
    <h1>You're invited to a party</h1>
    <p class="muted">Add songs from this music library to what's playing. No account needed.</p>
    <form id="joinform" class="card" style="flex-direction:column">
      <label for="name">Your name, so people know who picked what</label>
      <input id="name" maxlength="30" autocomplete="nickname" placeholder="Your name">
      <button type="submit">Join the party</button>
    </form>
  </section>
  <section id="party" class="hidden">
    <h1 id="pname"></h1>
    <p class="muted" id="pinfo"></p>
    <h2>Now playing</h2>
    <div class="card" id="playing"></div>
    <h2>Coming up from guests</h2>
    <div class="card" id="waiting"></div>
    <h2>Add a song</h2>
    <form id="searchform" role="search">
      <input id="q" type="search" placeholder="Song, artist or album" aria-label="Search the library">
      <button type="submit">Search</button>
    </form>
    <p id="msg" class="muted" aria-live="polite"></p>
    <div id="results"></div>
  </section>
  <section id="ended" class="hidden">
    <h1>This party has ended</h1>
    <p class="muted">Ask whoever runs the music for a new link.</p>
  </section>
</main>
<script>
(() => {
  const code = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
  const KEY = 'pm.party.' + code;
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let token = null; try { token = localStorage.getItem(KEY); } catch { /* private window */ }
  const show = (id) => ['join', 'party', 'ended'].forEach((s) => $('#' + s).classList.toggle('hidden', s !== id));
  const ended = () => { try { localStorage.removeItem(KEY); } catch { /* */ } token = null; show('ended'); };
  const api = async (method, path, body) => {
    const r = await fetch('/v1' + path, { method, headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 || r.status === 410) { const e = new Error(j.error || 'This party has ended'); e.ended = true; throw e; }
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  };
  const cover = (c) => (c ? `<img class="cover" alt="" loading="lazy" src="${esc(c)}${c.startsWith('/v1/') ? `?token=${encodeURIComponent(token)}` : ''}">` : '<div class="cover"></div>');
  const song = (s, extra = '', btn = '') => `<div class="row">${cover(s.cover)}<div class="grow"><div class="t">${esc(s.title)}${extra}</div><div class="a">${esc(s.artist)}</div></div>${btn}</div>`;
  const msg = (t, bad) => { const m = $('#msg'); m.textContent = t || ''; m.className = bad ? 'bad' : 'muted'; };
  let state = null;
  const paint = (v) => {
    state = v;
    document.title = v.party;
    $('#pname').textContent = v.party;
    const until = new Date(v.expires_at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('#pinfo').textContent = `${v.zone_name ? `Playing on ${v.zone_name} · ` : ''}until ${until} · you're ${v.you}`;
    $('#playing').innerHTML = v.playing ? song(v.playing) : '<p class="muted" style="margin:0">Nothing right now. Add a song to start the music.</p>';
    $('#waiting').innerHTML = v.waiting.length ? v.waiting.map((w) => song(w, w.mine ? '<span class="you">you</span>' : `<span class="you">${esc(w.by)}</span>`)).join('') : '<p class="muted" style="margin:0">Nothing yet.</p>';
    const left = v.adds_left === 0 && v.next_add_at ? `You can add another at ${new Date(v.next_add_at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.` : v.waiting_left === 0 ? 'Your songs are waiting; add more once one has played.' : `You can add ${v.adds_left} more this hour.`;
    if (!$('#msg').classList.contains('bad')) msg(left);
    const full = v.adds_left === 0 || v.waiting_left === 0;
    document.querySelectorAll('[data-add]').forEach((b) => { if (b.textContent !== 'Added') b.disabled = full; });
  };
  const refresh = async () => { try { paint(await api('GET', '/party/guest')); } catch (e) { if (e.ended) ended(); } };
  const start = async () => { show('party'); await refresh(); setInterval(refresh, 5000); };
  $('#joinform').onsubmit = async (e) => {
    e.preventDefault();
    try { const r = await api('POST', '/party/join', { code, name: $('#name').value.trim() || undefined }); token = r.token; try { localStorage.setItem(KEY, token); } catch { /* */ } start(); } catch (err) { if (err.ended) ended(); else alert(err.message); }
  };
  $('#searchform').onsubmit = async (e) => {
    e.preventDefault();
    const q = $('#q').value.trim(); if (!q) return;
    try {
      const found = await api('GET', '/party/guest/search?q=' + encodeURIComponent(q));
      $('#results').innerHTML = found.length ? `<div class="card">${found.map((s) => song(s, '', `<button class="ghost" data-add="${s.track_id}" aria-label="Add ${esc(s.title)}">Add</button>`)).join('')}</div>` : '<p class="muted">Nothing found in this library.</p>';
      document.querySelectorAll('[data-add]').forEach((b) => b.onclick = async () => {
        b.disabled = true;
        try { const v = await api('POST', '/party/guest/queue', { track_id: Number(b.dataset.add) }); msg(''); paint(v); b.textContent = 'Added'; } catch (err) { if (err.ended) { ended(); return; } msg(err.message, true); b.disabled = false; setTimeout(() => { msg(''); if (state) paint(state); }, 6000); }
      });
    } catch (err) { if (err.ended) ended(); else msg(err.message, true); }
  };
  if (token) start(); else show('join');
})();
</script>
</body>
</html>
