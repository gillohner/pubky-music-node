<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<style>
  /* The page's own layout; components come from app.css */
  body { overflow: auto; font-size: 16px; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 22px; }
  form { display: flex; gap: 8px; }
  form input { flex: 1; min-width: 0; }
  #joinform { flex-direction: column; align-items: stretch; }
  #msg { min-height: 1.2em; margin-top: 4px; }
  main section > h2.set-h { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <section id="join" hidden>
    <h1>You're invited to a party</h1>
    <p class="muted">Add songs from this music library to what's playing. No account needed.</p>
    <form id="joinform" class="card">
      <label for="name">Your name, so people know who picked what</label>
      <input id="name" class="input" maxlength="30" autocomplete="nickname" placeholder="Your name">
      <button class="btn primary" type="submit">Join the party</button>
    </form>
  </section>
  <section id="party" hidden>
    <h1 id="pname"></h1>
    <p class="muted" id="pinfo"></p>
    <h2 class="set-h">Now playing</h2>
    <div class="card set-list" id="playing"></div>
    <h2 class="set-h">Coming up from guests</h2>
    <div class="card set-list" id="waiting"></div>
    <h2 class="set-h">Add a song</h2>
    <form id="searchform" role="search">
      <input id="q" class="input" type="search" placeholder="Song, artist or album" aria-label="Search the library">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <p id="msg" class="muted small" aria-live="polite"></p>
    <div id="results"></div>
  </section>
  <section id="ended" hidden>
    <h1>This party has ended</h1>
    <p class="muted">Ask whoever runs the music for a new link.</p>
  </section>
</main>
<script>
(() => {
  const code = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
  const KEY = 'pm.party.' + code;
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let token = null; try { token = localStorage.getItem(KEY); } catch { /* private window */ }
  const show = (id) => ['join', 'party', 'ended'].forEach((s) => { $('#' + s).hidden = s !== id; });
  const ended = () => { try { localStorage.removeItem(KEY); } catch { /* */ } token = null; show('ended'); };
  const api = async (method, path, body) => {
    const r = await fetch('/v1' + path, { method, headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 || r.status === 410) { const e = new Error(j.error || 'This party has ended'); e.ended = true; throw e; }
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  };
  const cover = (c) => `<div class="art sm" style="width:48px;flex:0 0 48px">${c ? `<img alt="" loading="lazy" src="${esc(c)}${c.startsWith('/v1/') ? `?token=${encodeURIComponent(token)}` : ''}">` : ''}</div>`;
  const song = (s, extra = '', btn = '') => `<div class="set-item">${cover(s.cover)}<div class="grow"><div class="name">${esc(s.title)}${extra}</div><div class="sub">${esc(s.artist)}</div></div>${btn}</div>`;
  let bad = false;
  const msg = (t, isBad) => { bad = !!isBad; const m = $('#msg'); m.textContent = t || ''; m.className = isBad ? 'small warn-text' : 'muted small'; };
  let state = null;
  const paint = (v) => {
    state = v;
    document.title = v.party;
    $('#pname').textContent = v.party;
    const until = new Date(v.expires_at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('#pinfo').textContent = `${v.zone_name ? `Playing on ${v.zone_name} · ` : ''}until ${until} · you're ${v.you}`;
    $('#playing').innerHTML = v.playing ? song(v.playing) : '<p class="muted">Nothing right now. Add a song to start the music.</p>';
    $('#waiting').innerHTML = v.waiting.length ? v.waiting.map((w) => song(w, ` <span class="pill">${w.mine ? 'you' : esc(w.by)}</span>`)).join('') : '<p class="muted">Nothing yet.</p>';
    const left = v.adds_left === 0 && v.next_add_at ? `You can add another at ${new Date(v.next_add_at * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.` : v.waiting_left === 0 ? 'Your songs are waiting; add more once one has played.' : `You can add ${v.adds_left} more this hour.`;
    if (!bad) msg(left);
    const full = v.adds_left === 0 || v.waiting_left === 0;
    document.querySelectorAll('[data-add]').forEach((b) => { if (b.textContent !== 'Added') b.disabled = full; });
  };
  const refresh = async () => { try { paint(await api('GET', '/party/guest')); } catch (e) { if (e.ended) ended(); } };
  const start = async () => { show('party'); await refresh(); setInterval(refresh, 5000); };
  $('#joinform').onsubmit = async (e) => {
    e.preventDefault();
    try { const r = await api('POST', '/party/join', { code, name: $('#name').value.trim() || undefined }); token = r.token; try { localStorage.setItem(KEY, token); } catch { /* */ } start(); } catch (err) { if (err.ended) ended(); else alert(err.message); }
  };
  $('#searchform').onsubmit = async (e) => {
    e.preventDefault();
    const q = $('#q').value.trim(); if (!q) return;
    try {
      const found = await api('GET', '/party/guest/search?q=' + encodeURIComponent(q));
      $('#results').innerHTML = found.length ? `<div class="card set-list">${found.map((s) => song(s, '', `<button class="btn ghost sm" data-add="${s.track_id}" aria-label="Add ${esc(s.title)}">Add</button>`)).join('')}</div>` : '<p class="muted">Nothing found in this library.</p>';
      document.querySelectorAll('[data-add]').forEach((b) => b.onclick = async () => {
        b.disabled = true;
        try { const v = await api('POST', '/party/guest/queue', { track_id: Number(b.dataset.add) }); msg(''); paint(v); b.textContent = 'Added'; } catch (err) { if (err.ended) { ended(); return; } msg(err.message, true); b.disabled = false; setTimeout(() => { msg(''); if (state) paint(state); }, 6000); }
      });
    } catch (err) { if (err.ended) ended(); else msg(err.message, true); }
  };
  if (token) start(); else show('join');
})();
</script>
</body>
</html>
