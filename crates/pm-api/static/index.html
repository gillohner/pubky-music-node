<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pubky Music</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Pubky Music</span>
    </div>
    <nav class="nav" aria-label="Main">
      <div class="nav-group">
        <div class="nav-label">Library</div>
        <button class="nav-item" data-view="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
        <button class="nav-item" data-view="favourites"><svg class="ic"><use href="#i-heart"/></svg><span>Favourites</span></button>
        <button class="nav-item" data-view="albums"><svg class="ic"><use href="#i-disc"/></svg><span>Albums</span></button>
        <button class="nav-item" data-view="artists"><svg class="ic"><use href="#i-artist"/></svg><span>Artists</span></button>
        <button class="nav-item" data-view="genres"><svg class="ic"><use href="#i-genre"/></svg><span>Genres</span></button>
        <button class="nav-item" data-view="tracks"><svg class="ic"><use href="#i-notes"/></svg><span>Tracks</span></button>
        <button class="nav-item" data-view="playlists"><svg class="ic"><use href="#i-playlist"/></svg><span>Playlists</span></button>
        <button class="nav-item" data-view="radio"><svg class="ic"><use href="#i-radio"/></svg><span>Radio</span></button>
        <button class="nav-item" data-view="sources"><svg class="ic"><use href="#i-archive"/></svg><span>Sources</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Pubky</div>
        <button class="nav-item" data-view="discover"><svg class="ic"><use href="#i-compass"/></svg><span>Discover</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Playing</div>
        <button class="nav-item" data-view="queue"><svg class="ic"><use href="#i-queue"/></svg><span>Queue</span></button>
      </div>
      <div class="nav-group">
        <div class="nav-label">Node</div>
        <button class="nav-item" data-view="settings"><svg class="ic"><use href="#i-settings"/></svg><span>Settings</span></button>
      </div>
    </nav>
    <div class="node-status" id="conn"><span class="dot"></span><span class="node-text">Connecting…</span></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <label class="search" for="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search your library" autocomplete="off" spellcheck="false">
        <kbd title="Press / to search">/</kbd>
      </label>
      <div class="topbar-right" id="status"></div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <footer class="player">
    <div class="player-now" id="np" role="button" tabindex="0" aria-label="Now playing">
      <div class="np-art placeholder"></div>
      <div class="np-text"><div class="np-title muted">Nothing playing</div><div class="np-sub"></div></div>
    </div>
    <div class="player-center">
      <div class="transport">
        <button class="icon-btn" id="prev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
        <button class="icon-btn play" id="toggle" aria-label="Play"><svg class="ic"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="next" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
      </div>
      <div class="seek">
        <span class="time" id="pos">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
        <span class="time" id="dur">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <button class="quality" id="quality" title="Signal path"><span class="qdot"></span><span class="qtext">—</span></button>
      <div class="volume">
        <svg class="ic"><use href="#i-volume"/></svg>
        <input type="range" id="vol" min="-60" max="0" value="-20" aria-label="Volume in dB">
      </div>
      <button class="zone-btn" id="zonebtn"><svg class="ic"><use href="#i-zone"/></svg><span id="zonename">Zone</span><svg class="ic chev"><use href="#i-chevron"/></svg></button>
    </div>
  </footer>
</div>

<div class="popover" id="zonepop" hidden></div>
<div class="overlay" id="nowplaying" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<audio id="browser" preload="none"></audio>

<dialog id="login" class="dialog">
  <form method="dialog">
    <h2>Connect to your node</h2>
    <p class="muted">Paste the API token from the node's <code>node.toml</code>. It stays in this browser.</p>
    <label class="field"><span>API token</span><input id="tok" type="password" autocomplete="off"></label>
    <div class="dialog-actions"><button class="btn primary" value="ok">Connect</button></div>
  </form>
</dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z" fill="currentColor"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-artist" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></symbol>
    <symbol id="i-playlist" viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18 11v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="18" r="2" fill="currentColor"/></symbol>
    <symbol id="i-genre" viewBox="0 0 24 24"><path d="M4 7.5h7l2 2h7v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 7.5V6a1.5 1.5 0 0 1 1.5-1.5H9l2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 5.5h16v4H4zM5 9.5v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 13h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="14" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 12h3M7 15.5h3M6 8l10-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 9-2 5-4 1 2-5z" fill="currentColor"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m17 14 4 2.5-4 2.5z" fill="currentColor"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 6v12M18 6.5v11L9.5 12z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M17 6v12M6 6.5v11l8.5-5.5z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-zone" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7.5" r="1" fill="currentColor"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 7-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-playnext" viewBox="0 0 24 24"><path d="M4 6h10M4 12h7M4 18h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m15 11 5 3-5 3z" fill="currentColor"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M8 7l.7 12h6.6L16 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5m-4 4 4-4 4 4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<script src="/app.js"></script>
</body>
</html>
