[package]
name = "pm-app"
description = "Native controller and player for the Pubky Music Node (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pm-app"
path = "src/main.rs"

[features]
default = []
# Play through this machine's ALSA `hw:` devices (needs libasound).
alsa = ["dep:pm-out-local", "pm-out-local/alsa"]

[dependencies]
pm-model = { workspace = true }
pm-zones = { workspace = true }
pm-audio = { workspace = true }
pm-library = { workspace = true }
pm-api = { workspace = true }
pm-client = { workspace = true }
pm-out-local = { workspace = true, optional = true }
anyhow = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
