name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The ALSA output only compiles with libasound; its unit tests need no hardware.
      - run: cargo clippy -p pm-node -p pm-out-local -p pm-app -p pm-endpoint --all-targets --features alsa -- -D warnings
      - run: cargo test -p pm-out-local --features alsa
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pubky-music-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
