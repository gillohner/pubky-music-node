name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # One run per branch; a new push replaces the older run. Keyed by the event and the PR's
  # own branch: a pull_request run for a PR that has just been merged gets refs/heads/main
  # as its ref (the merge ref is gone), and with a ref-only key it cancelled main's CI.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
# Runners are pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 and the
# WebKitGTK package names the desktop job installs are per release.
# Every job has a timeout-minutes of about 4x its usual time, so a hang fails instead of
# holding a merge (usual times from green runs, 2026-10-23).
jobs:
  # Docs-only changes (docs/, Markdown, NOTICE, LICENSE) skip every other job: `check`,
  # `desktop` and `sidecar` wait on this, and the rest wait on `check`.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          code=$(printf '%s\n' "$files" | grep -Ev '^(docs/|NOTICE$|LICENSE$)|\.md$' | grep -c . || true)
          echo "$(printf '%s\n' "$files" | grep -c . || true) files changed, $code outside the docs"
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The ALSA output only compiles with libasound; its unit tests need no hardware.
      - run: cargo clippy -p pm-node -p pm-out-local -p pm-endpoint --all-targets --features alsa -- -D warnings
      # The cross-platform output compiles on Linux too (cpal uses ALSA there).
      - run: cargo clippy -p pm-out-local -p pm-endpoint --all-targets --features cpal -- -D warnings
      - run: cargo test -p pm-out-local --features alsa
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  # The node's download archive carries README.md, docs/deploy.md and docs/guides/ at their repo
  # paths, so the links between them work unpacked; the TrueNAS file mounts as many paths as it
  # says to edit. Runs on docs-only changes too.
  deploy-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: tools/release/node-docs.sh /tmp/archive && python3 -I tools/release/node-docs-check.py /tmp/archive
      - run: python3 -I tools/truenas-check.py deploy/truenas/docker-compose.yaml
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The app (Tauri 2: the web UI in a native window, plus a player) needs
    # WebKitGTK on Linux; it is outside the workspace so the other jobs do
    # not. Bundles for every platform come from the release workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/pm-desktop
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pm-desktop
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pubky-music-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
  sidecar:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sidecars/roon-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check index.js
      - run: npm test
  alsa-loopback:
    # The ALSA hw: output stays bit-perfect: played through the kernel's loopback card and compared byte for byte
    # (tools/alsa-loopback.py; docs/HARDWARE-TEST-PROMPT.md §C). Then two squeezelite players on ALSA in one node
    # group, measured apart at every click (tools/slim-sync-alsa.py). The runner's Azure kernel has no sound modules,
    # so the check runs in a small KVM guest booting Ubuntu's generic kernel over the runner's own filesystem
    # (virtme-ng). A hung guest fails the job after 20 minutes instead of holding the run (it takes 4-5).
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: alsa
      - name: a generic kernel with snd-aloop, and virtme-ng
        run: |
          sudo apt-get update
          # The kernel that linux-image-generic points at, without that metapackage: it also pulls in
          # all of linux-firmware and the microcode (hundreds of MB), which the guest does not need and
          # which once took the job past its 20 minutes on a slow mirror
          img=$(apt-cache depends linux-image-generic | sed -n 's/^ *Depends: \(linux-image-[0-9].*-generic\)$/\1/p' | head -1)
          kver=${img#linux-image-}
          [ -n "$img" ] || { echo "::error::no kernel behind linux-image-generic"; exit 1; }
          sudo apt-get install -y --no-install-recommends libasound2-dev alsa-utils qemu-system-x86 busybox-static \
            squeezelite "$img" "linux-modules-extra-$kver"
          sudo chmod a+r "/boot/vmlinuz-$kver"
          echo "KVER=$kver" >> "$GITHUB_ENV"
          pip install --user virtme-ng==1.41
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cargo build -p pm-node --features alsa
      - name: bit-perfect through snd-aloop; two squeezelite players in one group
        run: |
          mkdir -p ss-out
          vng -r "$KVER" --user root -m 2G --rwdir "$PWD/ss-out" -- bash -c "modprobe snd-aloop && aplay -l \
            && python3 -I tools/alsa-loopback.py target/debug/pm-node /tmp/lb \
            && python3 -I tools/slim-sync-alsa.py target/debug/pm-node /tmp/ss --seconds 45 --out $PWD/ss-out"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: slim-sync
          path: ss-out
          if-no-files-found: ignore
  slimproto:
    # Slimproto against real squeezelite: bit-exact at 16/44.1 and 24/96, position, pause and play,
    # reconnects (tools/slim-squeezelite.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squeezelite
      - run: cargo build -p pm-node
      - run: python3 -I tools/slim-squeezelite.py target/debug/pm-node /tmp/slim
      - if: failure()
        run: tail -50 /tmp/slim/node.log /tmp/slim/squeezelite.log
  plex:
    # The Plex source against a real Plex Media Server: Plex's official Linux build, pinned by
    # version and checksum, unpacked and run without Docker (tools/plex-source.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    env:
      PMS_VERSION: 1.43.5.11029-6bf8af3f0
      PMS_SHA256: 562edf9456be338a24182f837fe5d532d7e75ba7b3d5f6bea2503083e77622e1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Plex Media Server
        run: |
          curl -fsSLo /tmp/pms.deb "https://downloads.plex.tv/plex-media-server-new/$PMS_VERSION/debian/plexmediaserver_${PMS_VERSION}_amd64.deb"
          echo "$PMS_SHA256  /tmp/pms.deb" | sha256sum -c
          dpkg-deb -x /tmp/pms.deb /tmp/pms-root
      - run: cargo build -p pm-node
      - run: python3 -I tools/plex-source.py target/debug/pm-node /tmp/pms-root /tmp/plex
      - if: failure()
        run: tail -50 /tmp/plex/node.log /tmp/plex/pms.log
  audiobookshelf:
    # The Audiobookshelf source against a real Audiobookshelf: its server built from a pinned
    # release (tag and commit), run without Docker (tools/abs-source.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: check
    env:
      ABS_TAG: v2.37.1
      ABS_COMMIT: 3563d49424d50170324de9236a24c591b6d965e9
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Audiobookshelf
        run: |
          git clone -q --depth 1 -b "$ABS_TAG" https://github.com/advplyr/audiobookshelf.git /tmp/abs-src
          test "$(git -C /tmp/abs-src rev-parse HEAD)" = "$ABS_COMMIT"
          cd /tmp/abs-src && npm ci --no-audit --no-fund && npm run build:server
      - run: cargo build -p pm-node
      - run: python3 -I tools/abs-source.py target/debug/pm-node /tmp/abs-src "$(command -v ffmpeg)" /tmp/abs
      # Downloads with the real ffmpeg (the other download tests use a stand-in)
      - run: PM_REAL_FFMPEG=1 cargo test -p pm-api --test downloads real_ffmpeg
      - if: failure()
        run: tail -50 /tmp/abs/node.log /tmp/abs/abs.log
  bundle:
    # deploy/bundle: the node with its own Pubky homeserver (pinned pubky-homeserver image,
    # PostgreSQL, the config wrapper), up with docker compose; tools/bundle-check.py checks the
    # node manages it, what listens where, and that no generated password reaches a log.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p pm-node
      - name: the node's CI image
        run: |
          cp target/debug/pm-node deploy/docker/entrypoint.sh deploy/bundle/ci/
          docker build -q -t pubky-music-node:ci deploy/bundle/ci
          # The image carries ffmpeg with the encoders downloads use
          docker run --rm --entrypoint ffmpeg pubky-music-node:ci -hide_banner -encoders | grep -E ' aac | libmp3lame | libopus ' | wc -l | grep -qx 3
      - name: docker compose up
        working-directory: deploy/bundle
        run: |
          ./setup.sh
          sed -i 's/^PM_TAG=.*/PM_TAG=ci/' .env && echo PM_IMAGE=pubky-music-node >> .env
          # The homeserver's data in a folder the tests on the runner can read
          echo "HOMESERVER_DATA=$PWD/hsdata" >> .env
          mkdir -p music
          docker compose up -d
      - run: python3 -I tools/bundle-check.py deploy/bundle
      - name: owner sign-up, people, adding music (a test signer stands in for Pubky Ring)
        run: |
          export PM_BUNDLED_HS_ADMIN=http://127.0.0.1:6288
          export PM_BUNDLED_HS_FILES=$PWD/deploy/bundle/hsdata/data/files
          PM_BUNDLED_HS_PASSWORD=$(sed -n 's/^ADMIN_PASSWORD=//p' deploy/bundle/.env) && export PM_BUNDLED_HS_PASSWORD
          cargo test -p pm-api --test bundled_homeserver
          # The sources vault on the same homeserver: two clients, ciphertext only (VAULT.md)
          cargo test -p pm-pubky --test vault_homeserver
          cargo test -p pm-api --test vault_api
      - name: backup.sh, then restore.sh into a fresh install (as on a new disk)
        working-directory: deploy/bundle
        run: |
          python3 -I ../../tools/bundle-backup-check.py seed .
          python3 -I ../../tools/bundle-backup-check.py snap . $RUNNER_TEMP/before.json
          KEEP=1 ./backup.sh $RUNNER_TEMP/backups
          sleep 1
          KEEP=1 ./backup.sh $RUNNER_TEMP/backups
          # Only the newest is kept, and every file is the user's alone
          test "$(ls -d $RUNNER_TEMP/backups/2*/ | wc -l)" = 1
          B=$(ls -d $RUNNER_TEMP/backups/2*/)
          test -z "$(find $RUNNER_TEMP/backups -perm /077 | head -n 1)"
          # It never restores over a bundle that has containers or data
          if ./restore.sh "$B"; then echo "restore.sh overwrote a running bundle"; exit 1; fi
          docker compose down -v && sudo rm -rf hsdata
          ./restore.sh "$B"
          python3 -I ../../tools/bundle-backup-check.py compare . $RUNNER_TEMP/before.json
      - run: python3 -I tools/bundle-check.py deploy/bundle
      - name: the Umbrel app, as umbrelOS runs it (Umbrel's variables, this commit's node image)
        run: |
          (cd deploy/bundle && docker compose down)
          U=$RUNNER_TEMP/umbrel
          mkdir -p $U/root/data/storage
          # umbrelOS copies the package to app-data/<app-id> and drops the placeholders
          cp -r deploy/umbrel/pubky-music-node $U/app && find $U/app -name .gitkeep -delete
          # ... as its own user, uid 1000 (the node's uid too); the runner's user is 1001
          sudo chown -R 1000:1000 $U/app
          printf 'services:\n  node:\n    image: pubky-music-node:ci\n    devices: !reset []\n' > $U/ci.yml
          export APP_DATA_DIR=$U/app UMBREL_ROOT=$U/root DEVICE_DOMAIN_NAME=umbrel.local
          export APP_SEED=$(openssl rand -hex 32) APP_PASSWORD=$(openssl rand -hex 32)
          docker compose -p pubky-music-node -f $U/app/docker-compose.yml -f $U/ci.yml up -d
          python3 -I tools/umbrel-check.py pubky-music-node "$APP_SEED" "$APP_PASSWORD" "$APP_DATA_DIR"
      - if: failure()
        working-directory: deploy/bundle
        run: |
          docker compose ps -a && docker compose logs --no-color --tail 80
          docker compose -p pubky-music-node ps -a; docker compose -p pubky-music-node logs --no-color --tail 80 || true
  webdav:
    # A WebDAV share as a library root against a real WebDAV server (WsgiDAV, pinned), with a
    # password: scan, play in a zone, the browser stream, rescan, remove (tools/webdav-source.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m venv /tmp/dav && /tmp/dav/bin/pip install -q wsgidav==4.3.3 cheroot==11.1.2
      - run: cargo build -p pm-node
      - run: python3 -I tools/webdav-source.py target/debug/pm-node /tmp/dav/bin/wsgidav /tmp/webdav
      - if: failure()
        run: tail -50 /tmp/webdav/node.log /tmp/webdav/dav.log
  connection:
    # docs/CONNECTION.md: two browser controllers, the node killed and restored during playback.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cargo build -p pm-node
      - name: a node config and a four-minute track
        run: |
          mkdir -p /tmp/pc/data /tmp/pc/music /tmp/pc/shots
          python3 -c "import wave,struct,math; w=wave.open('/tmp/pc/music/tone.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000); w.writeframes(b''.join(struct.pack('<h', int(3000*math.sin(2*math.pi*220*n/8000))) for n in range(8000*240))); w.close()"
          cat > /tmp/pc/node.toml <<'TOML'
          data_dir = "/tmp/pc/data"
          [library]
          folders = ["/tmp/pc/music"]
          [api]
          listen = "127.0.0.1:7799"
          token = "ci-token"
          announce = false
          [outputs]
          discover = false
          upnp = false
          cast = false
          airplay = false
          slimproto_port = 0
          [remote]
          enabled = false
          TOML
      - name: Playwright with Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: kill and restore the node under two controllers
        run: |
          cd /tmp/pw
          PM_NULL_OUTPUT=realtime node $GITHUB_WORKSPACE/tools/ui-reconnect.js ci-token http://127.0.0.1:7799 /tmp/pc/shots \
            -- $GITHUB_WORKSPACE/target/debug/pm-node --config /tmp/pc/node.toml serve
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connection-shots
          path: /tmp/pc/shots
  web-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: design lint (classed buttons, no icon glyphs, every class styled)
        run: node tools/design-lint.js
      - run: cargo build -p pm-node
      - name: start a node on the audio fixtures
        run: |
          mkdir -p /tmp/pm/data /tmp/pm/music
          cp crates/pm-audio/tests/fixtures/*.flac /tmp/pm/music/
          cat > /tmp/pm/node.toml <<'TOML'
          data_dir = "/tmp/pm/data"
          [library]
          folders = ["/tmp/pm/music"]
          [api]
          listen = "127.0.0.1:7788"
          token = "ci-token"
          [outputs]
          discover = false
          upnp = false
          cast = false
          slimproto_port = 0
          TOML
          nohup ./target/debug/pm-node -c /tmp/pm/node.toml serve > /tmp/pm/node.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' http://127.0.0.1:7788/v1/info && break; sleep 1; done
          # The node scans its config folders at start
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' 'http://127.0.0.1:7788/v1/library/tracks?limit=1' | grep -q '"id"' && break; sleep 1; done
      - name: headless smoke test of every view
        run: |
          mkdir -p /tmp/uitest && cd /tmp/uitest && npm init -y >/dev/null && npm install --no-audit --no-fund jsdom@24 >/dev/null
          node $GITHUB_WORKSPACE/tools/ui-smoke.js ci-token http://127.0.0.1:7788 $GITHUB_WORKSPACE
      - name: no client secret, private key or keystore in the repository or the binary
        run: python3 -I tools/secret-scan.py --binary target/debug/pm-node
      - name: TIDAL sign-in with an app and no secret, through the return page (mock TIDAL)
        run: |
          mkdir -p /tmp/tl/data /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          printf 'data_dir = "/tmp/tl/data"\n[api]\nlisten = "127.0.0.1:7791"\n[outputs]\ndiscover = false\nupnp = false\ncast = false\nslimproto_port = 0\nairplay = false\n[remote]\nenabled = false\n[tidal]\nclient_id = "ci-project-app"\n[auth]\nreturn_page = "http://127.0.0.1:7811/callback"\n' > /tmp/tl/node.toml
          (cd /tmp/tl && HOME=/tmp/tl PM_TIDAL_AUTH_BASE=http://127.0.0.1:7811 PM_TIDAL_LOGIN_BASE=http://127.0.0.1:7811 PM_TIDAL_API_BASE=http://127.0.0.1:7811 \
            nohup $GITHUB_WORKSPACE/target/debug/pm-node -c /tmp/tl/node.toml serve > /tmp/tl/node.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7791/v1/info >/dev/null && break; sleep 1; done
          node $GITHUB_WORKSPACE/tools/ui-tidal-login.js http://127.0.0.1:7791 7811
      - if: failure()
        run: tail -50 /tmp/pm/node.log; tail -30 /tmp/fresh/node.log || true; tail -30 /tmp/tl/node.log || true

  speed:
    # A big library stays fast (steward next-3): 5,000 generated tracks, scan and rescan
    # times, pages and search in a real browser, against tools/perf-budget.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cargo build -p pm-node && cargo build -p pm-library --example big_library
      - name: scan 5,000 tracks, then rescan with nothing changed
        run: |
          mkdir -p /tmp/big/data
          ./target/debug/examples/big_library /tmp/big/music 5000
          cat > /tmp/big/node.toml <<'TOML'
          data_dir = "/tmp/big/data"
          [library]
          folders = ["/tmp/big/music"]
          watch = false
          [api]
          listen = "127.0.0.1:7788"
          token = "ci-token"
          [outputs]
          discover = false
          upnp = false
          cast = false
          slimproto_port = 0
          TOML
          budget() { node -p "require('./tools/perf-budget.json').scan.$1"; }
          for run in first rescan; do
            start=$(date +%s%N)
            ./target/debug/pm-node -c /tmp/big/node.toml scan
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            echo "$run scan: $ms ms (budget $(budget ${run}_ms))"
            [ "$ms" -le "$(budget ${run}_ms)" ] || { echo "SLOWER: $run scan"; exit 1; }
          done
      - name: pages and search (real browser)
        timeout-minutes: 20
        run: |
          nohup ./target/debug/pm-node -c /tmp/big/node.toml serve > /tmp/big/node.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' http://127.0.0.1:7788/v1/info && break; sleep 1; done
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node $GITHUB_WORKSPACE/tools/ui-perf.js ci-token http://127.0.0.1:7788 --budget $GITHUB_WORKSPACE/tools/perf-budget.json
      - if: failure()
        run: tail -50 /tmp/big/node.log

  ui-controls:
    # The controls audit on its own runner: it takes most of half an hour as the app grows.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cargo build -p pm-node
      - name: start a node on the audio fixtures
        run: |
          mkdir -p /tmp/pm/data /tmp/pm/music
          cp crates/pm-audio/tests/fixtures/*.flac /tmp/pm/music/
          cat > /tmp/pm/node.toml <<'TOML'
          data_dir = "/tmp/pm/data"
          [library]
          folders = ["/tmp/pm/music"]
          [api]
          listen = "127.0.0.1:7788"
          token = "ci-token"
          [outputs]
          discover = false
          upnp = false
          cast = false
          slimproto_port = 0
          TOML
          nohup ./target/debug/pm-node -c /tmp/pm/node.toml serve > /tmp/pm/node.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' http://127.0.0.1:7788/v1/info && break; sleep 1; done
          # The node scans its config folders at start
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' 'http://127.0.0.1:7788/v1/library/tracks?limit=1' | grep -q '"id"' && break; sleep 1; done
      - name: every visible control does something (real browser)
        timeout-minutes: 45
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node $GITHUB_WORKSPACE/tools/ui-controls.js ci-token http://127.0.0.1:7788
      - if: failure()
        run: tail -50 /tmp/pm/node.log
  ui-screens:
    # The other browser checks (accessibility, playback, YouTube, overlap, first run), split from
    # ui-controls so neither runs into its time limit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cargo build -p pm-node
      - name: start a node on the audio fixtures
        run: |
          mkdir -p /tmp/pm/data /tmp/pm/music
          cp crates/pm-audio/tests/fixtures/*.flac /tmp/pm/music/
          cat > /tmp/pm/node.toml <<'TOML'
          data_dir = "/tmp/pm/data"
          [library]
          folders = ["/tmp/pm/music"]
          [api]
          listen = "127.0.0.1:7788"
          token = "ci-token"
          [outputs]
          discover = false
          upnp = false
          cast = false
          slimproto_port = 0
          TOML
          nohup ./target/debug/pm-node -c /tmp/pm/node.toml serve > /tmp/pm/node.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' http://127.0.0.1:7788/v1/info && break; sleep 1; done
          # The node scans its config folders at start
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' 'http://127.0.0.1:7788/v1/library/tracks?limit=1' | grep -q '"id"' && break; sleep 1; done
      - name: Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: sign-in choosers (imports, refusal, remembered way, sign out; desktop and phone)
        run: cd /tmp/pw && node $GITHUB_WORKSPACE/tools/ui-signin.js ci-token http://127.0.0.1:7788
      - name: accessibility and 375 px (names, focus ring, keys, contrast, thumb targets)
        timeout-minutes: 15
        run: cd /tmp/pw && node $GITHUB_WORKSPACE/tools/ui-a11y.js ci-token http://127.0.0.1:7788
      - name: library FLACs play in the browser (also after a busy answer)
        timeout-minutes: 5
        run: cd /tmp/pw && node $GITHUB_WORKSPACE/tools/ui-playback.js ci-token http://127.0.0.1:7788
      - name: YouTube in this browser (YouTube's player API stood in; our controls drive it)
        run: cd /tmp/pw && node $GITHUB_WORKSPACE/tools/ui-youtube.js ci-token http://127.0.0.1:7788
      - name: no overlap on any screen (1440, 1024, 390 px; light and dark)
        timeout-minutes: 20
        run: cd /tmp/pw && node $GITHUB_WORKSPACE/tools/ui-overlap.js ci-token http://127.0.0.1:7788
      - name: setting a node up (Get started, config folders, grouping every kind of output, tokens)
        timeout-minutes: 5
        run: cd /tmp/pw && node $GITHUB_WORKSPACE/tools/ui-setup.js ci-token http://127.0.0.1:7788
      - name: first run from zero (a new node, no folders, contact or Pubky identity, until music plays)
        timeout-minutes: 10
        run: |
          mkdir -p /tmp/fresh/home/Music /tmp/fresh/data
          cp crates/pm-audio/tests/fixtures/*.flac /tmp/fresh/home/Music/
          printf '[api]\nlisten = "127.0.0.1:7790"\n[outputs]\ndiscover = false\nupnp = false\ncast = false\nslimproto_port = 0\nairplay = false\n[remote]\nenabled = false\n' > /tmp/fresh/node.toml
          (cd /tmp/fresh && HOME=/tmp/fresh/home nohup $GITHUB_WORKSPACE/target/debug/pm-node -c /tmp/fresh/node.toml serve > /tmp/fresh/node.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7790/v1/info && break; sleep 1; done
          cd /tmp/pw && PM_MUSIC_DIR=/tmp/fresh/home/Music node $GITHUB_WORKSPACE/tools/ui-first-run.js http://127.0.0.1:7790
      - if: failure()
        run: tail -50 /tmp/pm/node.log; tail -30 /tmp/fresh/node.log || true
