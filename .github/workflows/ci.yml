name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The ALSA output only compiles with libasound; its unit tests need no hardware.
      - run: cargo clippy -p pm-node -p pm-out-local -p pm-app -p pm-endpoint --all-targets --features alsa -- -D warnings
      - run: cargo test -p pm-out-local --features alsa
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pubky-music-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecars/roon-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check index.js
      - run: npm test
  web-ui:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p pm-node
      - name: start a node on the audio fixtures
        run: |
          mkdir -p /tmp/pm/data /tmp/pm/music
          cp crates/pm-audio/tests/fixtures/*.flac /tmp/pm/music/
          cat > /tmp/pm/node.toml <<'TOML'
          data_dir = "/tmp/pm/data"
          [library]
          folders = ["/tmp/pm/music"]
          [api]
          listen = "127.0.0.1:7788"
          token = "ci-token"
          [outputs]
          discover = false
          upnp = false
          cast = false
          slimproto_port = 0
          TOML
          nohup ./target/debug/pm-node -c /tmp/pm/node.toml serve > /tmp/pm/node.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -H 'Authorization: Bearer ci-token' http://127.0.0.1:7788/v1/info && break; sleep 1; done
          curl -sf -X POST -H 'Authorization: Bearer ci-token' -H 'content-type: application/json' -d '{}' http://127.0.0.1:7788/v1/library/scan
          sleep 5
      - name: headless smoke test of every view
        run: |
          mkdir -p /tmp/uitest && cd /tmp/uitest && npm init -y >/dev/null && npm install --no-audit --no-fund jsdom@24 >/dev/null
          node $GITHUB_WORKSPACE/tools/ui-smoke.js ci-token http://127.0.0.1:7788 $GITHUB_WORKSPACE
      - if: failure()
        run: tail -50 /tmp/pm/node.log
