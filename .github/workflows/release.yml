name: release
# Publishes the node image to GHCR for amd64 and arm64 (Umbrel boxes are
# mostly Raspberry Pis). Runs on version tags and by hand, not on every push:
# the arm64 cross-build is the expensive part of CI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (for example edge)"
        default: "edge"
      images:
        description: "Build and publish the multi-arch node image"
        type: boolean
        default: true
      binaries:
        description: "Build the native controller, node and endpoint for Linux, Windows and macOS"
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.images }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag || 'edge' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # Native controller (pm-app), node and endpoint for the desktops people run
  # them on. Linux gets bit-perfect ALSA playback; Windows and macOS play
  # through CoreAudio / WASAPI in shared mode (cpal) and control nodes.
  binaries:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.binaries }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            features: --features alsa
            ext: ""
          - os: windows-latest
            name: windows-x86_64
            features: --features pm-app/cpal
            ext: .exe
          - os: macos-latest
            name: macos-arm64
            features: --features pm-app/cpal
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo build --release -p pm-app -p pm-node -p pm-endpoint ${{ matrix.features }}
      - name: collect
        shell: bash
        run: |
          mkdir -p dist
          for b in pm-app pm-node pm-endpoint; do cp "target/release/$b${{ matrix.ext }}" dist/; done
          cp README.md docs/deploy.md dist/
          cd dist && tar czf "../pubky-music-${{ matrix.name }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: pubky-music-${{ matrix.name }}
          path: pubky-music-${{ matrix.name }}.tar.gz
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "pubky-music-${{ matrix.name }}.tar.gz" --clobber || gh release create "${GITHUB_REF_NAME}" "pubky-music-${{ matrix.name }}.tar.gz" --title "${GITHUB_REF_NAME}" --notes "See docs/CHANGELOG.md"
