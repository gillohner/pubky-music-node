name: release
# Every push to main replaces the `edge` pre-release (and the `edge` image);
# a `v*` tag makes a versioned release (and `latest`/semver images). A manual
# run builds everything from any branch as workflow artifacts and publishes
# nothing, which is how changes to this file are tried before they merge.
#
# - the app (pm-desktop, Tauri 2): macOS universal .dmg, Windows .msi and
#   setup .exe, Linux .AppImage and .deb for x86_64 and arm64, Android .apk
#   (arm64-v8a and universal) and .aab, signed with the repo's release key;
# - pm-node and pm-endpoint for Linux x86_64, arm64 and armv7 (Raspberry Pi),
#   plus Windows and macOS;
# - the multi-arch node image on GHCR.
#
# Builds are unsigned until the owner provides an Apple Developer ID and a
# Windows certificate.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  # One release run per ref at a time. A running build finishes and
  # publishes; newer pushes queue behind it (only the newest is kept).
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.m.outputs.channel }}
      version: ${{ steps.m.outputs.version }}
      publish: ${{ steps.m.outputs.publish }}
      android_version_code: ${{ steps.m.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        name: channel and version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel="$GITHUB_REF_NAME"; publish=true
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version; bump Cargo.toml first"
              exit 1
            fi
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            channel=edge; publish=true
          else
            channel=dev; publish=false
          fi
          # Android versionCode: the version (MMMmmmppp) times 1000, plus the run
          # number for edge builds and 999 for releases, so a release always
          # installs over the edge builds of its version.
          IFS=. read -r major minor patch <<< "${version%%-*}"
          base=$(( (major * 1000000 + minor * 1000 + patch) * 1000 ))
          if [ "$channel" = edge ] || [ "$channel" = dev ]; then
            code=$(( base + GITHUB_RUN_NUMBER % 999 ))
          else
            code=$(( base + 999 ))
          fi
          echo "channel=$channel version=$version publish=$publish android_version_code=$code"
          {
            echo "channel=$channel"; echo "version=$version"; echo "publish=$publish"
            echo "android_version_code=$code"
          } >> "$GITHUB_OUTPUT"

  app:
    name: app (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-x86_64
            os: windows-2025
            targets: ""
            args: --bundles msi,nsis
          # Ubuntu 22.04 keeps the AppImage and .deb on glibc 2.35, so they
          # run on Debian 12 and Ubuntu 22.04 too.
          - platform: linux-x86_64
            os: ubuntu-22.04
            targets: ""
            args: --bundles appimage,deb
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            targets: ""
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pm-desktop
          key: ${{ matrix.platform }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            libxdo-dev libasound2-dev patchelf file libfuse2
      - name: version
        shell: bash
        run: echo '{"version":"${{ needs.meta.outputs.version }}"}' > crates/pm-desktop/release.conf.json
      - name: build
        shell: bash
        working-directory: crates/pm-desktop
        run: |
          npm ci --no-audit --no-fund
          build() { npx tauri build --ci ${{ matrix.args }} --config release.conf.json; }
          if [ "$RUNNER_OS" = macOS ]; then
            # hdiutil now and then finds the new disk image busy and bundle_dmg.sh fails; the app is
            # compiled by then, so another try only bundles again.
            build || { echo "::warning::DMG bundling failed; trying again"; sleep 15; build; } \
              || { echo "::warning::DMG bundling failed twice; last try"; sleep 30; build; }
          else
            build
          fi
      - name: collect
        shell: bash
        run: tools/release/collect-app.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  android:
    needs: meta
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/pm-desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pm-desktop
          key: android
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The runner image has the Android SDK and NDK; gen/android is not
      # committed, so generate it, then apply our changes to it.
      - name: generate the Android project
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci --no-audit --no-fund
          npx tauri android init --ci --skip-targets-install
          npx tauri icon ../pm-api/static/icon.svg
          python3 -I ../../tools/release/android-patch.py .
      - name: build
        run: |
          echo '{"version":"${{ needs.meta.outputs.version }}","bundle":{"android":{"versionCode":${{ needs.meta.outputs.android_version_code }}}}}' > release.conf.json
          npx tauri android build --ci --apk --aab \
            --target aarch64 --target armv7 --target x86_64 --config release.conf.json
      - name: sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ../../tools/release/android-sign.sh
      - uses: actions/upload-artifact@v7
        with:
          name: app-android
          path: dist/*
          if-no-files-found: error

  android-emulator:
    # The phone as a zone (tools/android-endpoint.py): the signed release APK
    # on an x86_64 emulator connects to a node on the runner, plays a track
    # through AAudio in real time, and keeps playing in the background.
    needs: [android, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: app-android
          path: apk
      - uses: actions/download-artifact@v8
        with:
          name: binaries-linux-x86_64
          path: node
      - run: tar -C node -xzf node/pubky-music-node-linux-x86_64.tar.gz
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the phone as a zone
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # No sound card on the runner: the emulator's audio is consumed in real time and dropped.
          QEMU_AUDIO_DRV: none
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 -I tools/android-endpoint.py apk/pubky-music-android-universal.apk node/pubky-music-node-linux-x86_64/pm-node /tmp/ae
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator
          path: |
            /tmp/ae/*.png
            /tmp/ae/*.txt
            /tmp/ae/*.log
          if-no-files-found: ignore

  binaries:
    name: binaries (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            build: cargo build --release --locked -p pm-node -p pm-endpoint --features alsa
            dir: target/release
            bins: pm-node pm-endpoint
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            build: cargo build --release --locked -p pm-node -p pm-endpoint --features alsa
            dir: target/release
            bins: pm-node pm-endpoint
          - platform: linux-armv7
            os: ubuntu-24.04
            build: tools/release/build-armv7.sh
            dir: target/armv7-unknown-linux-gnueabihf/release
            bins: pm-node pm-endpoint
          - platform: windows-x86_64
            os: windows-2025
            build: cargo build --release --locked -p pm-node -p pm-endpoint --features pm-endpoint/cpal
            dir: target/release
            bins: pm-node.exe pm-endpoint.exe
          - platform: macos-arm64
            os: macos-15
            build: cargo build --release --locked -p pm-node -p pm-endpoint --features pm-endpoint/cpal
            dir: target/release
            bins: pm-node pm-endpoint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.platform != 'linux-armv7'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - if: matrix.platform == 'linux-armv7'
        uses: actions/cache@v5
        with:
          path: |
            .cargo-armv7
            target/armv7-unknown-linux-gnueabihf
          key: armv7-${{ hashFiles('Cargo.lock') }}
          restore-keys: armv7-
      - if: runner.os == 'Linux' && matrix.platform != 'linux-armv7'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: build
        shell: bash
        run: ${{ matrix.build }}
      - name: collect
        shell: bash
        run: |
          name="pubky-music-node-${{ matrix.platform }}"
          mkdir -p "pkg/$name" dist
          for b in ${{ matrix.bins }}; do cp "${{ matrix.dir }}/$b" "pkg/$name/"; done
          cp README.md docs/deploy.md "pkg/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd pkg && 7z a -tzip "../dist/$name.zip" "$name" >/dev/null)
          else
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ needs.meta.outputs.channel == 'edge' }}
            type=sha
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [meta, app, android, binaries, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          # Only this workflow's files: build-push-action's build record is
          # an artifact too, and it does not download.
          pattern: "{app,binaries}-*"
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: notes
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          short=${GITHUB_SHA::7}
          {
            if [ "$CHANNEL" = edge ]; then
              echo "The latest build of \`main\` ($short), replaced on every push. Not a release: expect rough edges."
            else
              echo "Pubky Music $CHANNEL. What changed: [docs/CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$CHANNEL/docs/CHANGELOG.md)."
            fi
            echo
            echo "| Download | For |"
            echo "| :-- | :-- |"
            echo "| \`pubky-music-macos-universal.dmg\` | the app on macOS (Apple silicon and Intel); unsigned: right-click → Open the first time |"
            echo "| \`pubky-music-windows-x86_64-setup.exe\` or \`.msi\` | the app on Windows; unsigned: SmartScreen → More info → Run anyway |"
            echo "| \`pubky-music-linux-x86_64.AppImage\` or \`.deb\` (also \`arm64\`) | the app on Linux |"
            echo "| \`pubky-music-android-arm64.apk\` (most phones), \`-universal.apk\`, \`.aab\` | the app on Android and Google TV |"
            echo "| \`pubky-music-node-linux-{x86_64,arm64,armv7}.tar.gz\` | the node and endpoint (armv7: 32-bit Raspberry Pi OS) |"
            echo "| \`ghcr.io/$GITHUB_REPOSITORY:$( [ "$CHANNEL" = edge ] && echo edge || echo "${CHANNEL#v}")\` | the node image (amd64, arm64) |"
            echo
            echo "Check downloads against \`SHA256SUMS\`."
          } > notes.md
      - name: edge
        if: needs.meta.outputs.channel == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Edge (main @ ${GITHUB_SHA::7})" --notes-file notes.md
      - name: versioned
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Pubky Music $GITHUB_REF_NAME" --notes-file notes.md
          fi
