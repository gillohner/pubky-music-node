[workspace]
resolver = "2"
members = [
    "crates/pm-model",
    "crates/pm-zones",
    "crates/pm-audio",
    "crates/pm-library",
    "crates/pm-pubky",
    "crates/pm-out-local",
    "crates/pm-api",
    "crates/pm-node",
    "crates/pm-client",
    "crates/pm-stream",
    "crates/pm-endpoint",
    "crates/pm-out-net",
    "crates/pm-out-upnp",
    "crates/pm-out-slimproto",
    "crates/pm-out-cast",
    "crates/pm-discovery",
    "crates/pm-remote",
    "crates/pm-out-snapcast",
    "crates/pm-out-airplay",
    "crates/pubky-music-specs",
]
# The desktop shell needs WebKitGTK on Linux; built on its own in CI/release.
exclude = ["crates/pm-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/gillohner/pubky-music-node"

[workspace.dependencies]
pm-model = { path = "crates/pm-model" }
pm-zones = { path = "crates/pm-zones" }
pm-audio = { path = "crates/pm-audio" }
pm-library = { path = "crates/pm-library" }
pm-pubky = { path = "crates/pm-pubky" }
pm-out-local = { path = "crates/pm-out-local" }
pm-api = { path = "crates/pm-api" }
pm-client = { path = "crates/pm-client" }
pm-stream = { path = "crates/pm-stream" }
pm-endpoint = { path = "crates/pm-endpoint" }
pm-out-net = { path = "crates/pm-out-net" }
pm-out-upnp = { path = "crates/pm-out-upnp" }
pm-out-slimproto = { path = "crates/pm-out-slimproto" }
pm-out-cast = { path = "crates/pm-out-cast" }
pm-out-snapcast = { path = "crates/pm-out-snapcast" }
pm-out-airplay = { path = "crates/pm-out-airplay" }
pm-discovery = { path = "crates/pm-discovery" }
pm-remote = { path = "crates/pm-remote" }

anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "json"] }
blake3 = "1.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
hound = "3.5"
id3 = "1.17"
mdns-sd = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6", default-features = false, features = ["flac", "alac", "isomp4", "wav", "aiff", "pcm", "mp3", "aac", "ogg", "vorbis", "id3v2", "opt-simd"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.28", features = ["v4", "serde"] }
walkdir = "2.5"
pubky = { version = "0.16.2", features = ["json"] }
pubky-app-specs = "0.8.1"
# v1 social objects (branch v1, 1.0.0-alpha.5), pinned until a release is published
pubky-social-specs = { git = "https://github.com/pubky/pubky-social-specs", rev = "acde362939dabb79a3b08de250bcbc70da4e827d" }
pubky-music-specs = { path = "crates/pubky-music-specs" }

[profile.release]
lto = "thin"
codegen-units = 4
