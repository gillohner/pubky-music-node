[workspace]
resolver = "2"
members = [
    "crates/pm-model",
    "crates/pm-zones",
    "crates/pm-audio",
    "crates/pm-library",
    "crates/pm-pubky",
    "crates/pm-out-local",
    "crates/pm-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/pubky/pubky-music-node"

[workspace.dependencies]
pm-model = { path = "crates/pm-model" }
pm-zones = { path = "crates/pm-zones" }
pm-audio = { path = "crates/pm-audio" }
pm-library = { path = "crates/pm-library" }
pm-pubky = { path = "crates/pm-pubky" }
pm-out-local = { path = "crates/pm-out-local" }

anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
hound = "3.5"
id3 = "1.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6", default-features = false, features = ["flac", "alac", "isomp4", "wav", "aiff", "pcm", "id3v2", "opt-simd"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.28", features = ["v4", "serde"] }
walkdir = "2.5"
pubky = { version = "0.16.2", features = ["json"] }
pubky-app-specs = "0.8.1"

[profile.release]
lto = "thin"
codegen-units = 4
